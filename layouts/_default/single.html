{{ define "main" }}
<div class="single">
  <div class="singleHead">
    <div class="singleHeadTexts">
      <h1 class="singleHeadTitle">{{.Title}}</h1>
      <p class="singleHeadDescription">{{.Params.description}}</p>
    </div>
    <div class="listItemCategories">
      {{ range (.GetTerms "categories") }}
      <a class="listItemCategory" href={{ .Permalink }}>{{ .Name }}</a>
      {{ end }}
    </div>
    <time class="publicationDate">{{ dateFormat .Site.Params.dateFormat .Date}}</time>
    <hr>
  </div>
  <div class="singleBottom">
   <div class="singleContent">
      {{ .Content }}
    </div> 
  </div>
</div>
{{ end }}
