name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.170.1
      HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8
      HUGO_ENVIRONMENT: production
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Hugo
        run: |
          bin_dir="$(mktemp -d "$RUNNER_TEMP/hugo-bin.XXXXXXXX")"
          archive="$bin_dir/hugo.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$bin_dir" hugo
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site in a clean directory
        id: hugo
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          destination="$(mktemp -d "$RUNNER_TEMP/hugo-site.XXXXXXXX")"
          hugo --gc --minify \
            --baseURL "${PAGES_BASE_URL%/}/" \
            --cacheDir "$RUNNER_TEMP/hugo-cache" \
            --destination "$destination"
          printf 'destination=%s\n' "$destination" >> "$GITHUB_OUTPUT"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.hugo.outputs.destination }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
